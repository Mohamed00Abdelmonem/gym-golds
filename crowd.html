<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Crowd — GoldTech</title>
  <script>tailwind.config = { theme: { extend: { colors: { gold: { DEFAULT: '#f5b041' } }, fontFamily: { display:['Poppins','Inter','system-ui','sans-serif'] } } } }</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased">
  <div id="app-root"></div>
  <script src="assets/js/components.js"></script>
  <script>
    Components.renderShell({title:'Live Crowd'});
    Components.init();
    document.getElementById('page-content').innerHTML = `
      <div class="glass rounded-2xl p-6">
        <div class="text-stone-400 text-xs">Live Gym Crowd</div>
        <div class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-4"><div class="glass p-4 rounded-lg"><div class="text-white font-bold text-3xl">68%</div><div class="text-stone-400 text-sm">Capacity used</div></div><div class="glass p-4 rounded-lg"><div class="text-stone-400 text-xs">Peak Hours</div><ul class="text-stone-400 mt-2"><li>18:00 - 19:00</li><li>06:30 - 08:00</li></ul></div><div class="glass p-4 rounded-lg"><div class="text-stone-400 text-xs">Available machines</div><div class="text-white font-bold mt-2">21</div></div></div>
        <div class="mt-4 glass p-4 rounded-lg"><div class="text-stone-400 text-xs">Floor heatmap</div><div id="heatmap" class="mt-2 grid grid-cols-12 gap-1 h-40"></div></div>
      </div>
    `;
    // populate heatmap
    const container = document.getElementById('heatmap'); for(let i=0;i<48;i++){ const d=document.createElement('div'); const v=Math.random(); d.style.background = v>0.7? 'rgba(245,176,65,0.9)': v>0.4? 'rgba(245,176,65,0.45)':'rgba(255,255,255,0.02)'; d.className='rounded-sm'; container.appendChild(d);}  
  </script>
</body>
</html>
