<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account — GoldTech</title>
  <script>tailwind.config = { theme: { extend: { colors: { gold: { DEFAULT: '#f5b041' } }, fontFamily: { display:['Poppins','Inter','system-ui','sans-serif'] } } } }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Poppins,system-ui;background:linear-gradient(180deg,#060607,#0d0d0e);color:#fff}.glass{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(8px)}</style>
</head>
<body class="antialiased">
  <div id="app-root"></div>
  <script src="assets/js/components.js"></script>
  <script>
    Components.renderShell({title:'Create Account — GoldTech'});
    Components.init();
    document.getElementById('page-content').innerHTML = `
      <div class="flex items-center justify-center min-h-[60vh]">
        <div class="w-full max-w-md p-6">
          <div class="glass rounded-2xl p-6">
            <h2 class="text-2xl font-extrabold">Create your account</h2>
            <p class="text-stone-400 text-sm mt-2">Join GoldTech and access premium club tools</p>
            <form class="mt-4 grid gap-3">
              <label class="text-stone-400 text-xs">Full name<input type="text" required class="glass mt-1 px-3 py-2 rounded-md bg-transparent text-white" /></label>
              <label class="text-stone-400 text-xs">Email<input type="email" required class="glass mt-1 px-3 py-2 rounded-md bg-transparent text-white" /></label>
              <label class="text-stone-400 text-xs">Password<input type="password" required class="glass mt-1 px-3 py-2 rounded-md bg-transparent text-white" /></label>
              <label class="text-stone-400 text-xs">Membership code (optional)<input type="text" class="glass mt-1 px-3 py-2 rounded-md bg-transparent text-white" placeholder="e.g. CLUB-GOLD" /></label>
              <button class="bg-gold text-black px-4 py-2 rounded-lg font-semibold">Create Account</button>
            </form>
            <div class="mt-4 text-stone-400 text-sm">Already registered? <a href="login.html" class="text-white font-semibold">Sign in</a></div>
          </div>
        </div>
      </div>
    `;
  </script>
</body>
</html>
